services:
  - type: web
    name: zephr-saml-poc
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DEFAULT_REDIRECT_URL
        value: /
      - key: SAML_ENTRY_POINT
        sync: false
      - key: SAML_ISSUER
        sync: false
      - key: SAML_CALLBACK_URL
        sync: false
      - key: SAML_AUDIENCE
        sync: false
      - key: SAML_IDP_ISSUER
        sync: false
      - key: SAML_IDP_CERT
        sync: false
      - key: SAML_PRIVATE_KEY
        sync: false
      - key: SAML_PUBLIC_CERT
        sync: false
      - key: SAML_FORCE_AUTHN
        value: "false"
      - key: SAML_ACCEPTED_CLOCK_SKEW_MS
        value: "5000"
      - key: ZEPHR_BASE_URL
        sync: false
      - key: ZEPHR_ADMIN_ACCESS_KEY
        sync: false
      - key: ZEPHR_ADMIN_SECRET_KEY
        sync: false
      - key: ZEPHR_SITE_ID
        sync: false
      - key: ZEPHR_PUBLIC_BASE_URL
        sync: false
      - key: ZEPHR_BROWSER_SDK_URL
        sync: false
      - key: ZEPHR_CREATE_ANON_SESSION
        value: "false"
      - key: ZEPHR_FOREIGN_KEY_NAME
        value: SAML_SUBJECT
      - key: ZEPHR_REQUIRED_GRANT_IDS
        sync: false
      - key: ZEPHR_REQUIRED_PRODUCT_IDS
        sync: false
      - key: ZEPHR_SESSION_COOKIE_DOMAIN
        sync: false
      - key: ZEPHR_LOGIN_WALL_LABEL
        value: Login Wall
      - key: ZEPHR_REGISTRATION_WALL_LABEL
        value: Registration Wall
      - key: ZEPHR_PROTECTED_WALL_LABEL
        value: Protected Content Wall
